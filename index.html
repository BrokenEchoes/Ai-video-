<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Video Editor</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin: 10px 0 8px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .card {
      background: #15151b;
      border: 1px solid #26262e;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .upload-box {
      border: 2px dashed #444;
      border-radius: 16px;
      padding: 30px 15px;
      text-align: center;
    }

    .upload-box p {
      color: #aaa;
      margin-bottom: 15px;
      font-size: 14px;
    }

    input[type="file"] {
      display: none;
    }

    .upload-btn {
      display: inline-block;
      background: white;
      color: black;
      padding: 13px 20px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    video {
      width: 100%;
      border-radius: 14px;
      margin-top: 18px;
      background: black;
      display: none;
      max-height: 400px;
    }

    .file-info {
      margin-top: 10px;
      color: #999;
      font-size: 13px;
      text-align: center;
      word-break: break-word;
    }

    label.title {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 15px;
    }

    textarea {
      width: 100%;
      height: 120px;
      resize: vertical;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 14px;
      background: #0e0e13;
      color: white;
      font-size: 15px;
      outline: none;
    }

    textarea:focus {
      border-color: #777;
    }

    textarea::placeholder {
      color: #666;
    }

    .range-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .range-value {
      color: #aaa;
    }

    input[type="range"] {
      width: 100%;
      cursor: pointer;
    }

    .hint {
      color: #777;
      font-size: 12px;
      margin-top: 8px;
      line-height: 1.5;
    }

    .generate-btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .generate-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      display: none;
      text-align: center;
      padding: 15px;
      margin-top: 18px;
      border-radius: 12px;
      background: #15151b;
      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
    }

    .result {
      display: none;
      margin-top: 20px;
    }

    .result h2 {
      font-size: 18px;
      margin-bottom: 12px;
    }

    .download-btn {
      display: block;
      text-align: center;
      text-decoration: none;
      background: white;
      color: black;
      padding: 14px;
      border-radius: 12px;
      font-weight: bold;
      margin-top: 12px;
    }

    .error {
      color: #ff7777;
    }

    .success {
      color: #8cff9a;
    }

    .loading {
      color: #ffd66b;
    }

  </style>

</head>

<body>

  <div class="app">

    <h1>AI Video Editor</h1>

    <div class="subtitle">
      Transform your video with AI
    </div>


    <!-- VIDEO UPLOAD -->

    <div class="card">

      <div class="upload-box">

        <p>
          Upload your original video
        </p>

        <label
          for="videoInput"
          class="upload-btn"
        >
          Select Video
        </label>

        <input
          type="file"
          id="videoInput"
          accept="video/*"
        >

        <video
          id="previewVideo"
          controls
          playsinline
        ></video>

        <div
          class="file-info"
          id="fileInfo"
        ></div>

      </div>

    </div>


    <!-- PROMPT -->

    <div class="card">

      <label class="title">
        Describe your transformation
      </label>

      <textarea
        id="prompt"
        maxlength="1000"
        placeholder="Example: Transform the scene into a cinematic rainy night, realistic movie look, preserve the original person's movement and camera motion..."
      ></textarea>

      <div class="hint">
        Describe what you want to change while keeping the original movement.
      </div>

    </div>


    <!-- STRENGTH -->

    <div class="card">

      <div class="range-row">

        <label class="title">
          Transformation Strength
        </label>

        <span
          class="range-value"
          id="strengthValue"
        >
          50%
        </span>

      </div>

      <input
        type="range"
        id="strength"
        min="0"
        max="100"
        value="50"
      >

      <div class="hint">
        Lower = closer to original video.
        Higher = stronger AI transformation.
      </div>

    </div>


    <!-- GENERATE -->

    <button
      class="generate-btn"
      id="generateBtn"
      onclick="generateVideo()"
    >
      Generate AI Video
    </button>


    <!-- STATUS -->

    <div
      class="status"
      id="status"
    ></div>


    <!-- RESULT -->

    <div
      class="card result"
      id="result"
    >

      <h2>
        Generated Video
      </h2>

      <video
        id="resultVideo"
        controls
        playsinline
      ></video>

      <a
        id="downloadBtn"
        class="download-btn"
        href="#"
        download
      >
        Download Video
      </a>

    </div>

  </div>


<script>

  // ==============================
  // ELEMENTS
  // ==============================

  const videoInput =
    document.getElementById("videoInput");

  const previewVideo =
    document.getElementById("previewVideo");

  const fileInfo =
    document.getElementById("fileInfo");

  const promptInput =
    document.getElementById("prompt");

  const strengthInput =
    document.getElementById("strength");

  const strengthValue =
    document.getElementById("strengthValue");

  const generateBtn =
    document.getElementById("generateBtn");

  const statusBox =
    document.getElementById("status");

  const resultBox =
    document.getElementById("result");

  const resultVideo =
    document.getElementById("resultVideo");

  const downloadBtn =
    document.getElementById("downloadBtn");


  // ==============================
  // SETTINGS
  // ==============================

  const MAX_FILE_SIZE =
    200 * 1024 * 1024;


  // ==============================
  // STRENGTH SLIDER
  // ==============================

  strengthInput.addEventListener(
    "input",
    function () {

      strengthValue.textContent =
        this.value + "%";

    }
  );


  // ==============================
  // VIDEO SELECT
  // ==============================

  videoInput.addEventListener(
    "change",
    function () {

      const file =
        this.files[0];

      if (!file) {
        return;
      }


      // File type check

      if (!file.type.startsWith("video/")) {

        alert(
          "Please select a valid video file."
        );

        videoInput.value = "";

        return;
      }


      // File size check

      if (file.size > MAX_FILE_SIZE) {

        alert(
          "Video is too large. Maximum size is 200 MB."
        );

        videoInput.value = "";

        return;
      }


      // Preview

      const videoURL =
        URL.createObjectURL(file);

      previewVideo.src =
        videoURL;

      previewVideo.style.display =
        "block";


      // File information

      const sizeMB =
        (file.size / 1024 / 1024)
        .toFixed(2);

      fileInfo.textContent =
        file.name +
        " • " +
        sizeMB +
        " MB";


      // Reset previous result

      resultBox.style.display =
        "none";

      resultVideo.removeAttribute(
        "src"
      );

    }
  );


  // ==============================
  // STATUS
  // ==============================

  function setStatus(
    message,
    type = "loading"
  ) {

    statusBox.style.display =
      "block";

    statusBox.className =
      "status " + type;

    statusBox.textContent =
      message;

  }


  // ==============================
  // GENERATE VIDEO
  // ==============================

  async function generateVideo() {

    const file =
      videoInput.files[0];

    const prompt =
      promptInput.value.trim();

    const strength =
      strengthInput.value;


    // Validation

    if (!file) {

      setStatus(
        "Please upload a video first.",
        "error"
      );

      return;
    }


    if (!prompt) {

      setStatus(
        "Please enter a transformation prompt.",
        "error"
      );

      promptInput.focus();

      return;
    }


    if (file.size > MAX_FILE_SIZE) {

      setStatus(
        "Video file is larger than 200 MB.",
        "error"
      );

      return;
    }


    // Disable button

    generateBtn.disabled =
      true;

    generateBtn.textContent =
      "Uploading...";


    setStatus(
      "Uploading your video...",
      "loading"
    );


    try {

      // ==========================
      // STEP 1
      // UPLOAD VIDEO
      // ==========================

      const formData =
        new FormData();

      formData.append(
        "video",
        file
      );


      const uploadResponse =
        await fetch(
          "/api/upload",
          {
            method: "POST",
            body: formData
          }
        );


      const uploadData =
        await uploadResponse.json();


      if (!uploadResponse.ok ||
          !uploadData.success) {

        throw new Error(
          uploadData.message ||
          "Video upload failed."
        );

      }


      // ==========================
      // STEP 2
      // GENERATE REQUEST
      // ==========================

      generateBtn.textContent =
        "Starting AI...";


      setStatus(
        "Video uploaded. Starting AI generation...",
        "loading"
      );


      const generateResponse =
        await fetch(
          "/api/generate",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              video:
                uploadData.video.path,

              filename:
                uploadData.video.filename,

              prompt:
                prompt,

              strength:
                Number(strength)

            })

          }
        );


      const generateData =
        await generateResponse.json();


      if (!generateResponse.ok ||
          !generateData.success) {

        throw new Error(
          generateData.message ||
          "Generation request failed."
        );

      }


      // ==========================
      // SUCCESS
      // ==========================

      setStatus(
        "AI video generation request created successfully. Job ID: " +
        generateData.jobId,
        "success"
      );


      generateBtn.textContent =
        "Generation Started";


    } catch (error) {

      console.error(error);


      setStatus(
        error.message ||
        "Something went wrong.",
        "error"
      );


      generateBtn.textContent =
        "Generate AI Video";


    } finally {

      generateBtn.disabled =
        false;

    }

  }

</script>

</body>
</html>
